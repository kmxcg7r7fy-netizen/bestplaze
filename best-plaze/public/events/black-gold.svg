<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070709"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A87A2B" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#F1D28A" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#D8B05A" stop-opacity="0.20"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="150" width="1600" height="10" fill="url(#gold)" opacity="0.9"/>
  <rect y="720" width="1600" height="10" fill="url(#gold)" opacity="0.65"/>
