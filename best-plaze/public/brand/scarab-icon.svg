<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D28A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A6E22"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="#080808"/>

  <!-- === SCARAB === -->

  <!-- Head: small circle at top -->
  <circle cx="50" cy="18" r="5.5" fill="none" stroke="url(#gold)" stroke-width="2.2"/>

  <!-- Neck connecting head to body -->
  <line x1="50" y1="23.5" x2="50" y2="29" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Upper body / thorax: wide rounded shape -->
  <path d="M36 29 Q50 26 64 29 L66 42 Q50 46 34 42 Z" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Left upper arm/wing curving out then down -->
  <path d="M36 33 Q24 31 20 38 Q18 45 28 50" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right upper arm/wing curving out then down -->
  <path d="M64 33 Q76 31 80 38 Q82 45 72 50" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Lower body / abdomen: big rounded rectangle -->
  <rect x="34" y="42" width="32" height="30" rx="12" fill="none" stroke="url(#gold)" stroke-width="2.2"/>

  <!-- Body center line -->
  <line x1="50" y1="42" x2="50" y2="72" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Body horizontal detail lines -->
  <path d="M36 52 Q50 55 64 52" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 62 Q50 65 64 62" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Left legs -->
  <line x1="34" y1="50" x2="20" y2="47" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="57" x2="19" y2="57" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="64" x2="20" y2="70" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right legs -->
  <line x1="66" y1="50" x2="80" y2="47" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="66" y1="57" x2="81" y2="57" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="66" y1="64" x2="80" y2="70" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bottom rounded feet -->
  <path d="M38 72 Q50 80 62 72" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
</svg>
